name: Inspect build errors
on:
  workflow_dispatch:
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-failure-logs
          run-id: 44677233238
          github-token: ${{ github.token }}
      - run: |
          grep -iE ' error:|Error:|ARCHIVE FAILED|fatal error|Undefined symbols' archive.log | cut -c1-600 | tail -40 | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
