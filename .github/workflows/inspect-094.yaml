name: Inspect build errors
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const r = await github.rest.actions.downloadArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: 14571852452, archive_format: 'zip'});
            fs.writeFileSync('/tmp/log.zip', Buffer.from(r.data));
            cp.execSync('unzip -o /tmp/log.zip -d /tmp/diag');
            const text = fs.readFileSync('/tmp/diag/archive.log','utf8');
            const lines = text.split('\n');
            for (let i=0;i<lines.length;i++) if (/Error:|error:|BUILD FAILED|ARCHIVE FAILED|Target kernel_snapshot|fatal error/i.test(lines[i])) core.error(lines.slice(Math.max(0,i-1),Math.min(lines.length,i+4)).join('\n').slice(0,2500));
