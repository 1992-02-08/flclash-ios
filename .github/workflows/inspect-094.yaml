name: Inspect build errors
on:
  workflow_dispatch:
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-failure-logs
          run-id: 44677233238
          github-token: ${{ github.token }}
      - run: |
          python3 - <<'PY'
          import re
          lines=open('archive.log', errors='replace').read().splitlines()
          for i,line in enumerate(lines):
              if re.search(r'error\[|error:|panicked|Caused by|could not compile|build_hooks|cargo.*failed|failed to run',line,re.I) and not line.startswith('lib/'):
                  block='\n'.join(lines[max(0,i-2):i+5])[:3000]
                  print('::error::'+block.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
