name: FlClash iOS unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Assemble pinned upstream and iOS port
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_TAG="$(cat .upstream-version)"
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          echo "Building upstream ${UPSTREAM_TAG}"
          curl -fL --retry 4 "https://codeload.github.com/chen08209/FlClash/tar.gz/refs/tags/${UPSTREAM_TAG}" -o /tmp/up.tgz
          mkdir up
          tar xzf /tmp/up.tgz -C up --strip-components=1
          cp -a ios up/ios
          cp -a tool/ios up/tool/ios
          cp -a core/cmd/ios up/core/cmd/ios
          cp core/platform/ios.go up/core/platform/
          for f in bride.h dns_android.go dns_ios.go; do cp "core/$f" "up/core/$f"; done
          cp lib/common/startup_trace.dart up/lib/common/
          for f in NOTICE setup.dart distribute_options.yaml; do cp "$f" up/; done
          python3 -c "import base64,gzip,pathlib; pathlib.Path('/tmp/port.patch').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('ios-patches/port.patch.gz.b64').read_text())))"
          patch -p1 -d up -i /tmp/port.patch
          mkdir -p up/plugins/prism_ui
          rm -rf up/core/Clash.Meta
          git clone --depth 1 -b FlClash https://github.com/chen08209/Clash.Meta.git up/core/Clash.Meta
          mkdir -p up/core/Clash.Meta/component/ca
          curl -fL --retry 4 https://curl.se/ca/cacert.pem -o up/core/Clash.Meta/component/ca/ca-certificates.crt
          python3 ios-patches/fix.py
          python3 ios-patches/fix_probe_ios.py up
          python3 ios-patches/fix_rust_ios.py up
          cp ios-patches/probe_http_test.go up/core/
          echo "UPSTREAM_VERSION=${UPSTREAM_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: up/core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Prepare toolchains
        run: |
          xcodebuild -version
          cd up/plugins/rust_api/rust
          rustup show active-toolchain
          rustup target add aarch64-apple-ios
      - name: Dependencies and generated Dart
        working-directory: up
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Check Dart compile errors
        working-directory: up
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['dart','analyze','--format','machine','lib'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          lines = result.stdout.splitlines()
          errors = [line for line in lines if line.startswith('ERROR|')]
          for error in errors:
              print('::error::' + error.replace('%','%25').replace('\r','%0D'))
          if not lines and result.returncode:
              print(result.stdout)
              raise SystemExit(result.returncode)
          print(f'Dart analysis: {len(errors)} errors')
          raise SystemExit(bool(errors))
          PY
      - name: Test HTTP probe wire protocol
        working-directory: up/core
        run: go test -count=1 -run '^TestIOSHTTPProbe' .
      - name: Build Go iOS archive
        working-directory: up
        run: PLATFORM_NAME=iphoneos bash tool/ios/build_core.sh
      - name: Configure Flutter
        working-directory: up
        run: |
          # Keep the App Store build number above the user's known working
          # 0.9.3 build 42, so installing this IPA actually replaces it.
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign --config-only --build-name "$UPSTREAM_VERSION" --build-number "$BUILD_NUMBER"
      - name: Archive unsigned app
        working-directory: up
        env:
          DISABLE_SWIFTLINT: '1'
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        run: |
          set -o pipefail
          xcodebuild archive -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FlClash.xcarchive" -skipPackagePluginValidation -skipMacroValidation APP_BUNDLE_ID=com.8w7vc.axwy CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/archive.log"
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/FlClash.xcarchive/Products/Applications/Runner.app"
          test -d "$app/PlugIns/NECore.appex"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" output
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/FlClash.app"
          find "$RUNNER_TEMP/ipa/Payload" -name _CodeSignature -type d -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/ipa/Payload" -name embedded.mobileprovision -delete
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/output/FlClash-${UPSTREAM_VERSION}-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-${{ env.UPSTREAM_VERSION }}-ios-unsigned
          path: output/*.ipa
          if-no-files-found: error
      - name: Summarize archive errors
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path(os.environ['RUNNER_TEMP'])/'archive.log'
          if not p.exists(): raise SystemExit(0)
          lines=p.read_text(errors='replace').splitlines()
          count=0
          for i,line in enumerate(lines):
              if re.search(r'error:|error\[|BuildException|fatal error|Undefined symbols|Caused by|panicked|failed to run',line,re.I):
                  text='\n'.join(lines[max(0,i-2):i+7])[:5000]
                  print('::error::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
                  count+=1
                  if count>=35: break
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-logs
          path: |
            ${{ runner.temp }}/archive.log
            up/.dart_tool/hooks_runner/**/stderr.txt
          if-no-files-found: ignore
